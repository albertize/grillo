apiVersion: v1
kind: Pod
metadata:
  name: multi
  labels:
    app: multi
spec:
  initContainers:
    - name: init
      image: busybox:1.37
      command: ["sh", "-c", "echo init"]
  containers:
    - name: app
      image: busybox:1.37
      command: ["sh", "-c", "sleep infinity"]
    - name: sidecar
      image: busybox:1.37
      command: ["sh", "-c", "sleep infinity"]

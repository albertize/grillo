# SPDX-License-Identifier: Apache-2.0
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  message: {{ .Values.message | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secret
type: Opaque
stringData:
  token: {{ .Values.token | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 16Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api
    spec:
      initContainers:
        - name: init
          image: {{ .Values.image | quote }}
          command: ["sh", "-c", "echo initialized > /shared/init"]
          volumeMounts:
            - name: shared
              mountPath: /shared
      containers:
        - name: api
          image: {{ .Values.image | quote }}
          command: ["sh", "-c", "test -s /shared/init && mkdir -p /www && printf '%s' \"$MESSAGE\" > /www/index.html && touch /tmp/ready && exec httpd -f -p 8080 -h /www"]
          env:
            - name: MESSAGE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: message
            - name: TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secret
                  key: token
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            exec:
              command: ["test", "-f", "/tmp/ready"]
            periodSeconds: 1
            timeoutSeconds: 1
            failureThreshold: 1
            successThreshold: 1
          volumeMounts:
            - name: shared
              mountPath: /shared
        - name: sidecar
          image: {{ .Values.image | quote }}
          command: ["sh", "-c", "while true; do sleep 5; done"]
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: shared
          emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-storage
spec:
  containers:
    - name: storage
      image: {{ .Values.image | quote }}
      command: ["sh", "-c", "while true; do sleep 5; done"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: {{ .Release.Name }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api
spec:
  selector:
    app: {{ .Release.Name }}-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-api
spec:
  rules:
    - host: scenario-c.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  name: http

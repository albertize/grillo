worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx.pid;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_max_body_size 4k;
  client_body_timeout 10s;
  server_tokens off;
  upstream ui_server { server ui:8080; }
  upstream go_server { server backend:8080; }
  server {
    listen 8080;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
    location /api/ { proxy_pass http://go_server; proxy_connect_timeout 3s; proxy_read_timeout 10s; }
    location = /healthz { proxy_pass http://go_server; proxy_connect_timeout 3s; proxy_read_timeout 10s; }
    location / { proxy_pass http://ui_server; proxy_connect_timeout 3s; proxy_read_timeout 10s; }
  }
}
